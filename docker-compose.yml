version: '3.8'

services:
  postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: stayshield-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stayshield"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml:
    build: ./ml
    container_name: stayshield-ml
    ports:
      - "${ML_PORT}:${ML_PORT}"
    restart: always

  api:
    build: ./api
    container_name: stayshield-api
    ports:
      - "${API_PORT}:${API_PORT}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=${API_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_started
    restart: always

  web:
    build: ./web
    container_name: stayshield-web
    ports:
      - "${WEB_PORT}:${WEB_PORT}"
    environment:
      - VITE_API_URL=http://api:${API_PORT}
    depends_on:
      - api
    restart: always
